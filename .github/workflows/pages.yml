name: Publish HELIOS Venus Lite
# The repository currently publishes GitHub Pages from main/(root).
# Keep this alternative Actions deployment manual to avoid dual publishers.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game
        run: |
          cd lite
          npm run check
          npm test
      - name: Stage static game files
        run: |
          mkdir -p public
          cp lite/index.html lite/style.css lite/engine.js lite/ecosystem.js lite/scenes.js lite/cinema.js lite/game.js lite/sw.js lite/manifest.webmanifest public/
          mkdir -p public/assets
          cp -R lite/assets/. public/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
