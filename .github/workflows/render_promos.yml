name: Render HELIOS concept trailers

on:
  push:
    branches: [main]
    paths:
      - 'tools/promos/render_promos.py'
      - '.github/workflows/render_promos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: helios-trailers-main
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check "numpy>=2,<3" "Pillow>=11,<13"
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          fc-match "Inter:style=Bold"

      - name: Verify Python source
        run: python -m py_compile tools/promos/render_promos.py

      - name: Render original visual promos and sound
        run: python tools/promos/render_promos.py --clip all

      - name: Check real video duration and codecs
        run: |
          for file in tools/promos/*.mp4; do
            ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json "$file"
          done
          test "$(find tools/promos -maxdepth 1 -name '*.mp4' | wc -l)" -eq 3

      - name: Stage videos and key frames
        run: |
          mkdir -p media/promos
          cp tools/promos/*.mp4 media/promos/
          cp tools/promos/*_preview.png media/promos/

      - name: Commit rendered assets into Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f media/promos/*.mp4 media/promos/*_preview.png
          if git diff --staged --quiet; then
            echo "All video artifacts are unchanged"
          else
            git commit -m "assets(promos): publish reproducible HELIOS concept trailers"
            git push origin HEAD:main
          fi
